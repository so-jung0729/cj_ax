<title>Stock Intelligence Lab 학습 노트</title>

<style>
/* Layout: 읽기 앱처럼 한 열. 홈 = 회차(Day) 목록, 회차 = 교시별 블록을 위에서 아래로 읽음 */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --ink:#15191f; --muted:#5b6472; --line:#e3e6eb;
  --accent:#0b6e4f; --accent-soft:#e3f2ec; --plan:#7a5c00; --plan-soft:#fbf1d3; --warn:#a33b1f; --warn-soft:#fbe7e1;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101318; --surface:#181c22; --ink:#e8ebef; --muted:#9aa3b0; --line:#2a3039;
  --accent:#4fc79a; --accent-soft:#163428; --plan:#e6c25a; --plan-soft:#352c12; --warn:#f08a6c; --warn-soft:#3a1d15; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101318; --surface:#181c22; --ink:#e8ebef; --muted:#9aa3b0; --line:#2a3039;
  --accent:#4fc79a; --accent-soft:#163428; --plan:#e6c25a; --plan-soft:#352c12; --warn:#f08a6c; --warn-soft:#3a1d15; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:680px;margin:0 auto}
a{color:inherit}
h1,h2,h3,h4{text-wrap:balance;line-height:1.35;margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

.top{padding-block:28px 20px}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.top h1{font-size:28px;font-weight:700;margin-top:6px}
.top p{color:var(--muted);margin:8px 0 0}
.progress{display:flex;align-items:center;gap:12px;margin-top:18px}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.progress span{font-family:var(--font-mono);font-size:13px;color:var(--muted)}

.list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.item a{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:start;text-decoration:none;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.item a:hover{border-color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-mono);font-weight:600;font-size:22px;line-height:1;color:var(--muted)}
.num small{display:block;font-size:11px;font-weight:500;margin-top:6px;letter-spacing:.02em}
.item.done .num{color:var(--accent)}
.body{min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted)}
.chip{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px}
.chip.done{background:var(--accent-soft);color:var(--accent)}
.chip.plan{background:var(--plan-soft);color:var(--plan)}
.item h2{font-size:18px;font-weight:700;margin-top:4px}
.core{margin:6px 0 0}

.back{display:inline-flex;gap:6px;align-items:center;margin-top:20px;font-size:14px;color:var(--muted);text-decoration:none}
.head{padding-block:14px 8px}
.head h1{font-size:26px;font-weight:700;margin-top:8px}
.lead{font-size:18px;font-weight:600;line-height:1.6;margin:14px 0 0;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.callout{margin-top:12px;padding:12px 16px;border-radius:12px;background:var(--warn-soft);color:var(--ink);font-size:15px}
.callout b{color:var(--warn)}

.toc{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.toc a{font-size:13px;text-decoration:none;padding:3px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--surface)}

.part{margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}
.part-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tag{font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--accent);text-transform:uppercase}
.part.plan .tag{color:var(--plan)}
.part h3{font-size:20px;font-weight:700}
.row{margin-top:12px}
.row h4{font-size:13px;font-weight:600;color:var(--muted)}
.row p{margin:4px 0 0}
.row ul{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.row li::marker{color:var(--muted)}
.result{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:12px}
.result h4{color:var(--accent)}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.files code{font-family:var(--font-mono);font-size:12.5px;padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line);overflow-wrap:anywhere}

.tbl{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:600}
td.n{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.note{font-size:13.5px;color:var(--muted);margin-top:6px}

.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:40px}
.nav a{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.nav a small{display:block;font-size:12px;color:var(--muted)}
.nav a.next{text-align:right}
.nav a:hover{border-color:var(--accent)}
footer{margin-top:40px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>

const pad = n => String(n).padStart(2,"0");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const chip = s => s==="done" ? '<span class="chip done">완료</span>' : '<span class="chip plan">예정</span>';
const ul = items => `<ul>${items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`;

function table(t){
  return `<div class="tbl"><table><thead><tr>${t.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${
    t.rows.map(r=>`<tr>${r.map((c,i)=>`<td${i>0&&/^[\d.\-]+/.test(c)?' class="n"':''}>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>${t.note?`<p class="note">${esc(t.note)}</p>`:""}`;
}

function home(){
  const done = DAYS.filter(d=>d.status==="done").length;
  return `<div class="view">
  <header class="top">
    <div class="eyebrow">개인 프로젝트 · 강의 Day별 실습</div>
    <h1>Stock Intelligence Lab</h1>
    <p>주가·거래량과 금융 뉴스로 종목을 분석하고, 예측이 실제 투자에 도움이 되는지 백테스트로 확인하는 웹 서비스를 만드는 기록.</p>
    <div class="progress"><div class="bar"><i style="width:${done/DAYS.length*100}%"></i></div><span>${done} / ${DAYS.length} 완료</span></div>
  </header>
  <ol class="list">
  ${DAYS.map(d=>`<li class="item ${d.status}"><a href="#day-${pad(d.n)}">
    <div class="num">${pad(d.n)}<small>${d.date}</small></div>
    <div class="body">
      <div class="meta">${chip(d.status)}<span>${esc(d.lecture)}</span></div>
      <h2>${esc(d.title)}</h2>
      <p class="core">${esc(d.core)}</p>
    </div></a></li>`).join("")}
  </ol>
  <footer>정보 제공 · 학습 목적의 개인 프로젝트이며 투자 권유가 아닙니다.</footer>
  </div>`;
}

function part(p, i, done){
  return `<article class="part ${done?"done":"plan"}" id="p${i}">
    <div class="part-head"><span class="tag">${esc(p.tag)}</span><h3>${esc(p.name)}</h3></div>
    <div class="row"><h4>이 시간에 배우는 것</h4><p>${esc(p.learn)}</p></div>
    <div class="row"><h4>${done?"이 프로젝트에서 한 것":"이 프로젝트에서 하는 것"}</h4><p>${esc(p.project)}</p></div>
    ${p.result?`<div class="result row"><h4>결과</h4>${ul(p.result)}${p.table?table(p.table):""}
      ${p.files?`<div class="files">${p.files.map(f=>`<code>${esc(f)}</code>`).join("")}</div>`:""}</div>`:""}
  </article>`;
}

function detail(d){
  const i = DAYS.indexOf(d), prev = DAYS[i-1], next = DAYS[i+1], done = d.status==="done";
  return `<div class="view">
  <a class="back" href="#">← 전체 목록</a>
  <header class="head">
    <div class="meta"><span class="mono">DAY ${pad(d.n)} · ${d.date}</span>${chip(d.status)}<span>강의: ${esc(d.lecture)}</span></div>
    <h1>${esc(d.title)}</h1>
  </header>
  <p class="lead">${esc(d.core)}</p>
  ${d.callout?`<div class="callout"><b>주의</b> ${esc(d.callout)}</div>`:""}
  <nav class="toc" aria-label="교시">${d.parts.map((p,k)=>`<a href="#day-${pad(d.n)}" data-jump="p${k}">${esc(p.tag)} · ${esc(p.name)}</a>`).join("")}</nav>
  ${d.parts.map((p,k)=>part(p,k,done)).join("")}
  <nav class="nav">
    ${prev?`<a href="#day-${pad(prev.n)}"><small>이전 · DAY ${pad(prev.n)}</small>${esc(prev.title)}</a>`:"<span></span>"}
    ${next?`<a class="next" href="#day-${pad(next.n)}"><small>다음 · DAY ${pad(next.n)}</small>${esc(next.title)}</a>`:"<span></span>"}
  </nav>
  </div>`;
}

function render(){
  const m = location.hash.match(/^#day-(\d{2})$/);
  const d = m && DAYS.find(x=>x.n===Number(m[1]));
  document.getElementById("app").innerHTML = d ? detail(d) : home();
  window.scrollTo(0,0);
}
document.addEventListener("click", e => {
  const a = e.target.closest("[data-jump]");
  if (!a) return;
  e.preventDefault();
  document.getElementById(a.dataset.jump)?.scrollIntoView({behavior:"smooth", block:"start"});
});
window.addEventListener("hashchange", render);
render();
</script>
