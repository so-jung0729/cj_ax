<style>
/* Layout: 읽기 앱처럼 한 열 리스트. 홈 = 회차(Day) 목록, 회차 = 한 화면짜리 읽을거리 */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --ink:#15191f; --muted:#5b6472; --line:#e3e6eb;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101318; --surface:#181c22; --ink:#e8ebef; --muted:#9aa3b0; --line:#2a3039;
  --accent:#4fc79a; --accent-soft:#163428; --plan:#e6c25a; --plan-soft:#352c12; color-scheme:dark}}
:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.7;

.wrap{max-width:680px;margin:0 auto}
a{color:inherit}
h1,h2,h3{text-wrap:balance;line-height:1.35;margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* 상단 */
.top{padding-block:28px 20px}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.top h1{font-size:28px;font-weight:700;margin-top:6px}

.bar i{display:block;height:100%;background:var(--accent)}
.progress span{font-family:var(--font-mono);font-size:13px;color:var(--muted)}

/* 회차 목록 */
.list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.item a{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:start;text-decoration:none;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.item a:hover{border-color:var(--accent)}
.item a:focus-visible,.nav a:focus-visible,.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-mono);font-weight:600;font-size:22px;line-height:1;color:var(--muted)}
.num small{display:block;font-size:11px;font-weight:500;margin-top:6px;letter-spacing:.02em}
.item.done .num{color:var(--accent)}
.body{min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted)}
.chip{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px}
.chip.done{background:var(--accent-soft);color:var(--accent)}
.chip.plan{background:var(--plan-soft);color:var(--plan)}
.item h2{font-size:18px;font-weight:700;margin-top:4px}
.core{margin:6px 0 0;color:var(--ink)}

/* 회차 상세 */
.back{display:inline-flex;gap:6px;align-items:center;margin-top:20px;font-size:14px;color:var(--muted);text-decoration:none}
.head{padding-block:14px 8px;border-bottom:1px solid var(--line)}
.head h1{font-size:26px;font-weight:700;margin-top:8px}
.lead{font-size:19px;font-weight:600;line-height:1.55;margin:18px 0 0;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
section{margin-top:28px}
section h3{font-size:13px;font-family:var(--font-mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-weight:600}
section ul{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
section li::marker{color:var(--muted)}
section p{margin:10px 0 0}
.files{list-style:none;padding:0}
.files li{font-family:var(--font-mono);font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;overflow-wrap:anywhere}
.tbl{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:600}
td.n{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.note{font-size:14px;color:var(--muted);margin-top:8px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:36px}
.nav a{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.nav a small{display:block;font-size:12px;color:var(--muted)}
.nav a.next{text-align:right}
.nav a:hover{border-color:var(--accent)}
footer{margin-top:40px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>

  core:"VOC 근거로 문제 Top 3를 먼저 정하고, 기능은 그다음에 고른다.",
  lectureCore:["고객 여정 지도: 한 사람 · 한 목표 · 단계별 경험","VOC 분류 3축과 페인포인트 진술문: 누가 · 언제 · 무엇을 · 막히는 이유","우선순위: 빈도 · 강도 · 해결 가능성"],
  doHere:["Day 4 VOC로 개인투자자 여정 지도 작성","기존 서비스 페인포인트 Top 3","서비스 가설 3가지를 채택 · 수정 · 폐기"],
  outputs:["research/users_competitors/journey_map.html","docs/painpoints.md"] }
];

const pad = n => String(n).padStart(2,"0");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const chip = s => s==="done" ? '<span class="chip done">완료</span>' : '<span class="chip plan">예정</span>';
const list = (items, cls="") => `<ul class="${cls}">${items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`;

function home(){
  const done = DAYS.filter(d=>d.status==="done").length;
  return `<div class="view">
  <header class="top">
    <div class="eyebrow">개인 프로젝트 · 강의 Day별 실습</div>
    <h1>Stock Intelligence Lab</h1>
    <p>주가·거래량과 금융 뉴스로 종목을 분석하고, 예측이 실제 투자에 도움이 되는지 백테스트로 확인하는 웹 서비스를 만드는 기록.</p>
    <div class="progress"><div class="bar"><i style="width:${done/DAYS.length*100}%"></i></div><span>${done} / ${DAYS.length} 완료</span></div>
  </header>
  <ol class="list">
  ${DAYS.map(d=>`<li class="item ${d.status}"><a href="#day-${pad(d.n)}">
    <div class="num">${pad(d.n)}<small>${d.date}</small></div>
    <div class="body">
      <div class="meta">${chip(d.status)}<span>${esc(d.lecture)}</span></div>
      <h2>${esc(d.title)}</h2>
      <p class="core">${esc(d.core)}</p>
    </div></a></li>`).join("")}
  </ol>
  <footer>정보 제공 · 학습 목적의 개인 프로젝트이며 투자 권유가 아닙니다.</footer>
  </div>`;
}

function detail(d){
  const i = DAYS.indexOf(d), prev = DAYS[i-1], next = DAYS[i+1];
  const tbl = d.table ? `<div class="tbl"><table><thead><tr>${d.table.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${
    d.table.rows.map(r=>`<tr><td>${r[0]}</td><td class="n">${r[1]}</td><td class="n">${r[2]}</td></tr>`).join("")}</tbody></table></div><p class="note">${esc(d.table.note)}</p>` : "";
  return `<div class="view">
  <a class="back" href="#">← 전체 목록</a>
  <header class="head">
    <div class="meta"><span class="mono">DAY ${pad(d.n)} · ${d.date}</span>${chip(d.status)}<span>강의: ${esc(d.lecture)}</span></div>
    <h1>${esc(d.title)}</h1>
  </header>
  <p class="lead">${esc(d.core)}</p>
  <section><h3>강의 핵심</h3>${list(d.lectureCore)}</section>
  <section><h3>이 프로젝트에서 할 일</h3>${list(d.doHere)}</section>
  ${d.results ? `<section><h3>결과</h3>${list(d.results)}${tbl}</section>` : ""}
  ${d.left ? `<section><h3>남은 일</h3>${list(d.left)}</section>` : ""}
  <section><h3>${d.status==="done"?"만든 파일":"만들 파일"}</h3>${list(d.outputs,"files")}</section>
  <nav class="nav">
    ${prev?`<a href="#day-${pad(prev.n)}"><small>이전 · DAY ${pad(prev.n)}</small>${esc(prev.title)}</a>`:"<span></span>"}
    ${next?`<a class="next" href="#day-${pad(next.n)}"><small>다음 · DAY ${pad(next.n)}</small>${esc(next.title)}</a>`:"<span></span>"}
  </nav>
  </div>`;
}

function render(){
  const m = location.hash.match(/^#day-(\d{2})$/);
  const d = m && DAYS.find(x=>x.n===Number(m[1]));
  document.getElementById("app").innerHTML = d ? detail(d) : home();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", render);
render();
</script>
