:root{color-scheme:light;--ink:#111418;--ink2:#4A5159;--ink3:#6B727A;--line:#E6E8EB;--band:#F5F6F7;--accent:#FFD400;

*{box-sizing:border-box} html,body{margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:#fff;color:var(--ink);font-family:Pretendard,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:16px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
[hidden]{display:none!important} a{color:inherit} :focus-visible{outline:3px solid var(--blue);outline-offset:2px}
code{background:var(--band);padding:1px 6px;border-radius:6px;font-size:13px;font-family:ui-monospace,Consolas,monospace}

/* ---------- 홈 ---------- */
.home{max-width:1280px;margin:0 auto;padding-block:28px 56px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.hero{background:var(--ink);color:#fff;border-radius:24px;padding:34px 36px 26px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:var(--accent);opacity:.95}
.hero>*{position:relative;z-index:1}
.eyebrow{margin:0;color:var(--accent);font-weight:800;font-size:14px;letter-spacing:.02em}
.hero h1{margin:6px 0 2px;font-size:44px;line-height:1.15;font-weight:900;letter-spacing:-.04em}
.lead{margin:0 0 22px;font-size:21px;font-weight:700;color:#E3E5E8;max-width:680px}
.hero-data{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;max-width:1080px}
.hero-data div{background:#22272E;border-radius:14px;padding:12px 14px}
.hero-data small{display:block;color:#AEB4BA;font-size:13px;font-weight:700}
.hero-data b{font-size:26px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero-data .alert b{color:#FFB199}
.hero-note{margin:12px 0 0;color:#8D949B;font-size:13px}
.storyline{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;overflow-x:auto;padding:12px 0;margin:6px 0 4px;background:#fff;scrollbar-width:none}

.sl{flex:1 0 auto;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:var(--band);text-decoration:none;font-weight:800;font-size:15px;white-space:nowrap}
.sl b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px}
.sl.plan{color:var(--ink3)} .sl.plan b{background:#C9CDD2}
.sl:hover{background:var(--accent);color:var(--ink)}
.ch{margin-top:30px;scroll-margin-top:70px}
.ch-h{display:flex;gap:16px;align-items:flex-start;margin-bottom:14px}
.no{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:var(--accent);font-size:20px;font-weight:900}
.ch.plan .no{background:#ECEEF0;color:var(--ink3)}
.ch-h>div{flex:1;min-width:0}
.ck{margin:0;font-size:14px;color:var(--ink3)} .ck b{color:var(--ink)}
.ck .st{margin-left:6px;vertical-align:1px}
.ch h2{margin:2px 0 4px;font-size:26px;line-height:1.3;font-weight:900;letter-spacing:-.03em;text-wrap:balance}
.ans{margin:0;color:var(--ink2);font-size:16.5px;max-width:880px}
.more{flex:none;align-self:center;font-weight:800;font-size:15px;text-decoration:none;padding:8px 14px;border-radius:99px;background:var(--band);white-space:nowrap}
.more:hover{background:var(--accent)}
.rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.kc{display:flex;flex-direction:column;border-radius:18px;overflow:hidden;background:var(--band);text-decoration:none;transition:transform .12s,box-shadow .12s}
a.kc:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(17,20,24,.10)}
.th{position:relative;min-height:138px;padding:16px 16px 14px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;background:#E9ECEF}
.th strong{font-size:30px;line-height:1.1;font-weight:900;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.th small{font-size:13px;font-weight:700;opacity:.75}
.t-red{background:#FFE8DD;color:#9C2F00} .t-blue{background:#E1ECFC;color:#0F3F82} .t-green{background:#E0F3E5;color:#1E6B30}
.t-yellow{background:#FFF1A8;color:#4D3D00} .t-gray{background:#ECEEF0;color:#2A2F36} .t-dark{background:var(--ink);color:#fff}
.t-purple{background:#ECE5FF;color:#4527A0} .t-teal{background:#D5F0EA;color:#00594A}
.t-plan{background:repeating-linear-gradient(135deg,#F1F3F5 0 10px,#ECEEF0 10px 20px);color:#5C636B}
.kt{padding:12px 16px 16px;display:flex;flex-direction:column;gap:3px}
.kt b{font-size:16.5px;line-height:1.35;font-weight:800;letter-spacing:-.02em}
.kt span{font-size:14px;color:var(--ink2);line-height:1.45}
.kt em{font-style:normal;display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.kt em i{font-style:normal;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:#fff;color:var(--ink2)}
.spark{width:100%;height:44px;margin-top:6px}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;margin-top:10px;background:rgba(17,20,24,.08)}
.stack i{display:block;height:100%}
.quote{margin:0;font-size:19px;line-height:1.4;font-weight:900;letter-spacing:-.03em}
.quote:before{content:"“";display:block;color:var(--accent);font-size:40px;line-height:.6}
.ev{display:inline-block;margin-top:6px;font-family:ui-monospace,Consolas,monospace;font-size:12px;font-weight:700;background:rgba(255,255,255,.7);padding:1px 6px;border-radius:6px;align-self:flex-start}
.bridge{margin:18px 0 0 18px;padding-left:44px;border-left:3px dashed #CED4DA;color:var(--ink2);font-size:16px;font-weight:700;min-height:42px;display:flex;align-items:center;gap:10px}
.bridge span{flex:none;white-space:nowrap;background:var(--ink);color:#fff;font-size:12.5px;padding:2px 10px;border-radius:99px}
.foot{margin:34px 0 0;font-size:14px;color:var(--ink3)}
.foot a{font-weight:700}

/* ---------- 상세 ---------- */
.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;background:var(--ink);color:#fff;
  padding-block:calc(8px + env(safe-area-inset-top,0px)) 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.back{color:#fff;font-size:15px;font-weight:700;text-decoration:none;padding:5px 10px;border-radius:8px;white-space:nowrap}
.back:hover,.tab:hover{background:#2A2F36}
.cur{font-size:18px;font-weight:800;white-space:nowrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{padding:5px 14px;border-radius:99px;color:#E3E5E8;font-size:15px;font-weight:700;text-decoration:none;white-space:nowrap}
.tab.plan{color:#8D949B}
.tab[aria-current="page"]{background:var(--accent);color:var(--ink)}
.dhero{background:var(--ink);color:#EEF3F1;padding-block:22px 28px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.d-eyebrow{color:var(--accent);font-weight:700;font-size:13px;letter-spacing:.06em}

.alert{margin-top:14px;max-width:820px;background:#3A1D15;color:#FFD9CC;border-radius:12px;padding:10px 14px;font-size:15px;line-height:1.55}
.alert b{color:#FFB199}
.dmain{padding-block:20px 64px;font-size:15.5px;line-height:1.6}
.card{background:var(--band);border-radius:16px;padding:18px}
.table-scroll{overflow-x:auto}
.chk{width:100%;border-collapse:collapse;font-size:14px}

.chk th{font-size:12.5px;color:var(--ink2);font-weight:700}
.chk td.path{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.st{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.st.ok{background:#DCEFE0;color:var(--ok)} .st.part{background:#F5EBC6;color:var(--warn)}
.st.miss{background:#FBE1D6;color:var(--bad)} .st.plan{background:#ECEEF0;color:var(--plan)}
.dmain h2{font-size:21px;margin:40px 0 10px;letter-spacing:-.02em}
.dmain h2 .n{color:var(--signal);margin-right:8px}
.sub{color:var(--ink2);margin:0 0 16px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

.kpi span{color:var(--ink2);font-size:13px}
.kpi.red b{color:var(--bad)} .kpi.green b{color:var(--ok)}
.period{background:var(--band);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.period .ph{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.period .tag{font-size:12px;font-weight:800;color:#fff;background:var(--ink);padding:2px 10px;border-radius:99px;white-space:nowrap}
.period.plan .tag{background:#9AA1A8}
.period h3{margin:0;font-size:17px;letter-spacing:-.02em}
.period dl{margin:0;display:grid;gap:8px}
.period dt{font-size:12.5px;font-weight:700;color:var(--ink3)}
.period dd{margin:2px 0 0}
.period ul{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.period .res{background:#fff;border-radius:12px;padding:10px 12px}
.period .res dt{color:var(--ok)}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.files code{background:#fff;border:1px solid var(--line);overflow-wrap:anywhere}
.datat{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border-radius:12px;overflow:hidden}
.datat th,.datat td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left}
.datat th{font-size:12.5px;color:var(--ink2)}
.datat td.n{font-variant-numeric:tabular-nums;font-family:ui-monospace,Consolas,monospace;white-space:nowrap}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:40px}
.pn a{display:block;text-decoration:none;background:var(--band);border-radius:14px;padding:12px 14px;font-weight:800;min-width:0}
.pn a small{display:block;font-size:12px;font-weight:700;color:var(--ink3)}
.pn a.next{text-align:right}
.pn a:hover{background:var(--accent)}
.dfoot{margin-top:40px;color:var(--ink3);font-size:12.5px;border-top:1px solid var(--line);padding-top:12px}

@media (max-width:760px){
  .home{padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hero{padding:24px 20px 20px;border-radius:20px} .hero h1{font-size:32px} .lead{font-size:17px}
  .hero:after{width:150px;height:150px;right:-50px;top:-50px}
  .hero-data{grid-template-columns:1fr 1fr} .hero-data b{font-size:21px}
  .ch-h{flex-wrap:wrap;gap:12px} .no{width:42px;height:42px;font-size:17px;border-radius:13px}
  .ch h2{font-size:21px} .ch-h>div{flex:1 1 calc(100% - 60px)} .more{order:3;margin-left:54px}
  .rail{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 6px;gap:12px}
  .kc{flex:0 0 74%;scroll-snap-align:start}
  .bridge{margin-left:8px;padding-left:22px;font-size:15px}
  .cur{font-size:16px}
  .bar{position:static}
  .chk td,.chk th{padding:8px 6px}
}
@media (prefers-reduced-motion:reduce){.kc{transition:none}}
</style>

const ST = {ok:"완료",part:"일부",no:"미완",plan:"예정"};
const st = s => `<span class="st ${s==="no"?"miss":s}">${ST[s]}</span>`;
const route = d => `day-${pad(d.n)}`;

  const tabs = DAYS.map(x=>`<a class="tab ${x.status==="plan"?"plan":""}" href="#${route(x)}"${x===d?' aria-current="page"':""}>${pad(x.n)} ${x.key}</a>`).join("");
  const req = `<div class="card table-scroll"><table class="chk"><thead><tr><th>강의 요구 산출물</th><th>이 저장소의 파일</th><th>상태</th><th>메모</th></tr></thead><tbody>${
    d.req.map(([a,b,s,m])=>`<tr><td>${esc(a)}</td><td class="path">${esc(b)}</td><td>${st(s)}</td><td>${esc(m)}</td></tr>`).join("")}</tbody></table></div>`;
  let sec = 0; const h = t => `<h2><span class="n">${pad(++sec)}</span>${t}</h2>`;
  const kpi = d.kpi ? h("한눈에") + `<div class="grid g4">${d.kpi.map(([b,s],k)=>`<div class="card kpi ${k===3&&d.n===2?"red":""}"><b>${b}</b><span>${s}</span></div>`).join("")}</div>` : "";
  const tbl = d.table ? h(d.table.title) + `<div class="table-scroll"><table class="datat"><thead><tr>${d.table.head.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${
    d.table.rows.map(r=>`<tr>${r.map((c,k)=>`<td${k>0&&/^[\d.\-]/.test(c)?' class="n"':""}>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div><p class="sub" style="margin-top:6px;font-size:13px">${esc(d.table.note)}</p>` : "";
  const parts = h(plan?"교시별 계획":"교시별로 한 것") + `<p class="sub">${plan?"강의 각 시간에 배우는 것과 이 프로젝트에서 할 일입니다.":"강의 각 시간에 배운 것, 이 프로젝트에서 한 것, 실제로 나온 결과입니다."}</p><div class="grid g2">${
    d.parts.map(p=>`<article class="period ${plan?"plan":""}"><div class="ph"><span class="tag">${esc(p.tag)}</span><h3>${esc(p.name)}</h3></div><dl>
      <div><dt>이 시간에 배우는 것</dt><dd>${md(p.learn)}</dd></div>
      <div><dt>${plan?"이 프로젝트에서 할 일":"이 프로젝트에서 한 것"}</dt><dd>${md(p.did)}</dd></div>
      ${p.res?`<div class="res"><dt>결과</dt><dd><ul>${p.res.map(r=>`<li>${md(r)}</li>`).join("")}</ul>${p.files?`<div class="files">${p.files.map(f=>`<code>${esc(f)}</code>`).join("")}</div>`:""}</dd></div>`:""}
    </dl></article>`).join("")}</div>`;
  return `<header class="bar"><a class="back" href="#">← 한 줄기로</a><span class="cur">Stock Intelligence Lab</span><nav class="tabs" aria-label="Day 선택">${tabs}</nav></header>
  <section class="dhero"><div class="wrap">
    <div class="d-eyebrow">DAY ${pad(d.n)} · ${d.date} · ${esc(d.lecture)}</div>
    <h1>${esc(d.dtitle)}</h1><p class="dlead">${esc(d.dlead)}</p>
    ${d.alert?`<div class="alert"><b>주의</b> ${esc(d.alert)}</div>`:""}
  </div></section>
  <main class="wrap dmain">${req}${kpi}${tbl}${parts}
    <nav class="pn">${prev?`<a href="#${route(prev)}"><small>이전 · Day ${pad(prev.n)}</small>${esc(prev.dtitle.split(" — ")[1])}</a>`:"<span></span>"}${next?`<a class="next" href="#${route(next)}"><small>다음 · Day ${pad(next.n)}</small>${esc(next.dtitle.split(" — ")[1])}</a>`:"<span></span>"}</nav>
    <p class="dfoot">강의 원래 날짜 ${d.date} · 실제 작업과 날짜는 다를 수 있음 · 상태: 완료 = 파일 있음 · 일부 = 대체하거나 부족 · 미완 = 하지 않음 · 예정 = 아직 진행 전</p>
  </main>`;
}

const homeEl = document.getElementById("home"), viewEl = document.getElementById("view");
homeEl.innerHTML = home();
function render(){
  const m = location.hash.match(/^#day-(\d{2})$/);
  const d = m && DAYS.find(x=>x.n===Number(m[1]));
  if (d){ viewEl.innerHTML = detail(d); homeEl.hidden = true; viewEl.hidden = false; document.title = `Day ${pad(d.n)} · Stock Intelligence Lab`; window.scrollTo(0,0); }
  else { homeEl.hidden = false; viewEl.hidden = true; document.title = "Stock Intelligence Lab"; }
}
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest("[data-jump]");
  if (!a) return;
  e.preventDefault();
  document.getElementById(a.dataset.jump)?.scrollIntoView({block:"start"});
});
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
